name: Update contenuti sito
on:
    push:
        branches:
            - 'task/**'
            - 'feature/**'
    workflow_dispatch:

jobs:
    update-link-sito:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
          - uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: "3.11"

          - name: Build index.html file
            run: python .github/scripts/build_indexhtml.py

          - name: Commit new index.html
            run: |
                git config user.name "github-actions"
                git config user.email "github-actions@github.com"
                git add index.html || echo "Nothing to add"
                git commit -m "Rebuilt index.html" || echo "No changes to commit"
                git push || echo "Nothing to push"
