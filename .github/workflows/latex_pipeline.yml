name: Apply Template & Build PDFs

on:
  push:
    branches:
      - 'task/**'
      - 'feature/**'
  workflow_dispatch:

jobs:
  latex-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install LaTeX environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-italian \
            texlive-pictures \
            latexmk

      # 🔥 Compila SEMPRE tutti i .tex
      - name: Build all LaTeX files
        run: |
          python .github/scripts/build_pdfs.py

      - name: Commit generated PDFs
        run: |
          echo "Committo i PDF generati..."

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs || echo "No PDFs to add"

          git commit -m "Auto-generated PDFs via GitHub Actions" || echo "No changes to commit"

          # Rebase per evitare errori di push non fast-forward
          git pull --rebase origin ${{ github.ref_name }}

          git push origin HEAD:${{ github.ref_name }}