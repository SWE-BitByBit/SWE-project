name: Apply Template & Build PDFs

on:
  push:
    branches:
      - 'task/**'
      - 'feature/**'
  workflow_dispatch:

jobs:
  # Inserimento dei ^G nei file latex in corrispondenza dei termini del glossario
  process-glossary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Extract glossary terms
      run: |
        python .github/scripts/extract_glossary_terms.py
    
    - name: Process LaTeX files
      run: |
        python .github/scripts/add_glossary_references.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git pull
        git add .
        git commit -m "Auto: Aggiornati termini glossario" || echo "Nessuna modifica per il commit"
        git push || echo "Nessuna modifica per il push"

  # Build dei pdf a partire dai file latex
  latex-pipeline:
    needs: process-glossary
    runs-on: ubuntu-latest

    container:
      image: bigbuckbunny/latex-pdf-build-env:latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Build all LaTeX files
        id: build
        continue-on-error: true
        run: |
          python .github/scripts/build_pdfs.py

      - name: Show LaTeX logs on failure
        if: steps.build.outcome == 'failure'
        run: |
          find . -name "*.log" | while read log; do
            if grep -q "^!" "$log"; then
              echo "=== ERRORE IN: $log ==="
              grep -B 2 -A 5 "^!" "$log"
            fi
          done

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Commit generated PDFs
        run: |
          echo "Committo i PDF generati..."

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs || echo "No PDFs to add"

          git commit -m "Auto-generated PDFs via GitHub Actions" || echo "No changes to commit"

          # Rebase per evitare errori di push non fast-forward
          git pull --rebase origin ${{ github.ref_name }}

          git push origin HEAD:${{ github.ref_name }}