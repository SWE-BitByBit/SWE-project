name: Update Gulpease Index

on:
  push:
    branches:
      - '**'
    
jobs:
  gulpease:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Gulpease script
        run: |
          python .github/scripts/gulpease.py

      - name: Commit and push CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add metrics-measurements/gulpease_index.csv
          git commit -m "chore(metrics): update Gulpease index" || echo "No changes to commit"
          git push
